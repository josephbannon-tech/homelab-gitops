name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install yamllint
      - run: yamllint -c .yamllint.yaml .

  no-vendored-deps:
    name: No vendored chart dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if dependency tarballs or lockfiles are tracked
        run: |
          found=$(git ls-files 'charts/*/charts/*' 'charts/*/Chart.lock' '*.tgz')
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::Vendored Helm dependencies are tracked. ArgoCD renders these instead of the version in Chart.yaml."
            exit 1
          fi

  dashboards-in-sync:
    name: Dashboard generator is source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate dashboards and fail on drift
        run: |
          python3 charts/dashboards/gen-dashboards.py
          if ! git diff --exit-code charts/dashboards/; then
            echo "::error::Committed dashboard YAML does not match gen-dashboards.py output."
            echo "::error::Either regenerate after editing the generator, or port manual YAML edits into the generator."
            exit 1
          fi

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Cache Helm repository data
        uses: actions/cache@v6
        with:
          path: ~/.cache/helm
          key: helm-${{ hashFiles('charts/**/Chart.yaml', 'charts/**/Chart.lock') }}

      - name: Lint Helm charts
        run: |
          for chart in charts/argocd charts/kube-prometheus-stack charts/loki charts/promtail charts/sealed-secrets charts/cloudnative-pg; do
            echo "--- $chart ---"
            helm dependency update "$chart"
            helm lint "$chart"
          done
