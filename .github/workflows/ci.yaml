name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pip install yamllint
      - run: yamllint -c .yamllint.yaml .

  dashboards-in-sync:
    name: Dashboard generator is source of truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Regenerate dashboards and fail on drift
        run: |
          python3 charts/dashboards/gen-dashboards.py
          if ! git diff --exit-code charts/dashboards/; then
            echo "::error::Committed dashboard YAML does not match gen-dashboards.py output."
            echo "::error::Either regenerate after editing the generator, or port manual YAML edits into the generator."
            exit 1
          fi

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      - name: Cache Helm repository data
        uses: actions/cache@v5
        with:
          path: ~/.cache/helm
          key: helm-${{ hashFiles('charts/**/Chart.yaml', 'charts/**/Chart.lock') }}

      - name: Lint Helm charts
        run: |
          for chart in charts/argocd charts/kube-prometheus-stack charts/loki charts/promtail charts/sealed-secrets; do
            echo "--- $chart ---"
            helm dependency update "$chart"
            helm lint "$chart"
          done
