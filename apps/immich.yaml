apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
  annotations:
    # After cloudnative-pg (wave -1): the Cluster CR needs the CRD + operator.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/josephbannon-tech/homelab-gitops.git
    targetRevision: HEAD
    path: charts/immich
    helm:
      releaseName: immich
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  # Stateful: operator-owned replicas on the server Deployment (restore of the
  # library or DB wants it scaled to 0). The Postgres Cluster is CNPG's.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: immich-server
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
