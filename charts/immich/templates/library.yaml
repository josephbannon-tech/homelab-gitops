# Photo originals on the NAS over NFS, as a static PV + PVC so the pod cannot
# start against a missing mount (Immich also fails closed on its own `.immich`
# marker files; that is a boot-order dependency, not a bug).
#
# Pool decided 2026-09-30: dataset JBNAS_SSD/immich (the validated layout; first
# irreplaceable family data goes on the SSD RAIDZ1 pool). NAS side: dataset
# owned by apps:apps (568), NFS export to 192.168.0.207 with mapall=apps so
# whatever uid the pods run as writes as 568 (the usual Immich-on-NFS uid
# complaint, settled up front). Immich's own nightly DB dumps land in
# upload/backups on this volume as a second copy of the metadata.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library
spec:
  capacity:
    storage: 200Gi
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-static
  mountOptions:
    - nfsvers=4
    - hard
    - noatime
  nfs:
    server: 192.168.0.201
    path: /mnt/JBNAS_SSD/immich
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
spec:
  storageClassName: nfs-static
  accessModes: ["ReadWriteMany"]
  volumeName: immich-library
  resources:
    requests:
      storage: 200Gi
