kube-prometheus-stack:
  # Grafana — exposed on NodePort 30300
  grafana:
    # The chart bundles ~24 upstream Grafana dashboards (node-exporter, k8s
    # views). We provision our own from charts/dashboards/gen-dashboards.py;
    # the bundled set is redundant clutter in the dashboard list.
    defaultDashboardsEnabled: false
    service:
      type: NodePort
      nodePort: 30300
    persistence:
      enabled: true
      storageClassName: local-path
      size: 2Gi
    # initChownData disabled: local-path PVs don't allow the chown init container to run.
    # fsGroup 472 (grafana uid) ensures the kernel sets correct group ownership at mount time.
    initChownData:
      enabled: false
    securityContext:
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
    # Admin credentials come from the grafana-admin SealedSecret
    # (charts/secrets/grafana-admin.yaml). Pinning via existingSecret stops the
    # chart regenerating a random admin password on every render, which rotated
    # the Secret out from under the SQLite DB on each drift sync and rolled the
    # deployment daily (login 401s; see homelab docs/observability.md).
    # Retrieve: kubectl get secret -n monitoring grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # Image renderer sidecar (separate Deployment + Service). Powers the
    # /render/* HTTP endpoints used to PNG-snapshot dashboards. The chart
    # auto-configures grafana.ini.rendering.{server_url, callback_url} and
    # the shared renderer token — do not override here.
    imageRenderer:
      enabled: true
      replicas: 1
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}
    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        isDefault: false
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.monitoring.svc.cluster.local:3200
        access: proxy
        isDefault: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1h"
            spanEndTimeShift: "1h"
            filterByTraceID: true
            filterBySpanID: true
          lokiSearch:
            datasourceUid: loki
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: "-1h"
            spanEndTimeShift: "1h"

  # Prometheus — NodePort 30900 for direct PromQL access
  prometheus:
    service:
      type: NodePort
      nodePort: 30900
    prometheusSpec:
      retention: 30d
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
      additionalScrapeConfigs:
        - job_name: node-exporter-external
          static_configs:
            - targets: ['192.168.0.201:9100']
              labels: {hostname: JBNAS01, role: nas}
            - targets: ['192.168.0.203:9100']
              labels: {hostname: JBVM02, role: claude-code}
            - targets: ['192.168.0.204:9100']
              labels: {hostname: JBVM03, role: prod}
            - targets: ['192.168.0.206:9100']
              labels: {hostname: JBVM01, role: jumpbox}
            - targets: ['192.168.0.205:9100']
              labels: {hostname: JBDNS01, role: dns}
            - targets: ['192.168.0.200:9100']
              labels: {hostname: JBSRV01, role: hypervisor}
          relabel_configs:
            - source_labels: [__address__]
              regex: '([^:]+):.*'
              target_label: instance
              replacement: '$1'
        - job_name: proxmox
          metrics_path: /pve
          params:
            module: [default]
          static_configs:
            - targets:
                - 192.168.0.200
              labels:
                hostname: JBSRV01
                role: proxmox
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: pve-exporter.monitoring.svc.cluster.local:9221
        # smartctl_exporter runs only on JBSRV01 (Proxmox host); the NAS VM only
        # sees QEMU virtio devices, so SMART data is collected once at the host
        # where all 8 physical drives are visible.
        - job_name: smartctl
          static_configs:
            - targets: ['192.168.0.200:9633']
              labels: {hostname: JBSRV01, role: hypervisor}
          relabel_configs:
            - source_labels: [__address__]
              regex: '([^:]+):.*'
              target_label: instance
              replacement: '$1'
        # mc-monitor pings the MC server-list-ping endpoint and exposes
        # minecraft_status_* metrics on :9150. RCON is not used.
        - job_name: minecraft
          static_configs:
            - targets: ['192.168.0.204:9150']
              labels: {hostname: JBVM03, role: prod}
          relabel_configs:
            - source_labels: [__address__]
              regex: '([^:]+):.*'
              target_label: instance
              replacement: '$1'
        # NOTE: pihole and plex are scraped via ServiceMonitor in their own
        # charts (charts/pihole-exporter/servicemonitor.yaml,
        # charts/plex-exporter/servicemonitor.yaml). Both SMs set job=pihole
        # and job=plex via relabeling so existing recording rules still match.
        # External targets below stay as static_configs because they live
        # outside the cluster (ServiceMonitor doesn't apply).
        # tailscaled --debug exposes Prometheus-format metrics at /debug/metrics.
        # Only enabled on hosts that actually run Tailscale (JBVM03, JBDNS01).
        - job_name: tailscale-nodes
          metrics_path: /debug/metrics
          static_configs:
            - targets: ['192.168.0.204:5252']
              labels: {hostname: JBVM03, role: prod}
            - targets: ['192.168.0.205:5252']
              labels: {hostname: JBDNS01, role: dns}
          relabel_configs:
            - source_labels: [__address__]
              regex: '([^:]+):.*'
              target_label: instance
              replacement: '$1'

  # Alertmanager — config loaded from k8s Secret (webhook URL kept out of Git)
  # Secret 'alertmanager-main' in namespace 'monitoring' holds alertmanager.yaml
  # To update: kubectl edit secret alertmanager-main -n monitoring, then rollout restart
  alertmanager:
    alertmanagerSpec:
      configSecret: alertmanager-main
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi

  # node-exporter runs as a DaemonSet — picks up host metrics automatically
  prometheus-node-exporter:
    enabled: true

  # k3s embeds these components — they don't expose standard metrics ports.
  # Disable to prevent false-positive "Down" alerts.
  kubeScheduler:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeProxy:
    enabled: false

  # Built-in alert rules: the chart ships 148. We keep ~69 — the groups that
  # match this single-node estate's signal model (apps, storage, and the
  # monitoring stack itself) and ALL recording-rule groups (dashboards depend
  # on them, left at their default true). The 11 groups below are dropped:
  # k3s embeds the control-plane components (kube{Proxy,Scheduler,Controller
  # Manager} produce false "down" noise), it uses kine/sqlite not etcd, the
  # apiserver-SLO and multi-node kubelet/system alerts don't fit a one-node
  # cluster, there are no resource quotas, and nodeExporterAlerting includes
  # NodeMemoryHighUtilization (the MemAvailable false-positive already removed)
  # and duplicates the curated NodeFilesystem* rules below.
  defaultRules:
    rules:
      etcd: false
      kubeApiserverSlos: false
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubelet: false
      kubernetesResources: false
      kubernetesSystem: false
      network: false
      nodeExporterAlerting: false
      windows: false

  # Family-services SLO rules (recording + multi-window multi-burn-rate alerts).
  # Targets:
  #   plex      99.5% / 30d   error budget = 0.5%
  #   minecraft 99.0% / 30d   error budget = 1.0%
  #   pihole    99.9% / 30d   error budget = 0.1%
  #   nas       99.9% / 30d   error budget = 0.1%
  #   tailscale 99.0% / 30d   error budget = 1.0% (per node)
  # Alerts: fast burn (14.4x over 1h+5m → critical), slow burn (6x over 6h+30m → warning).
  # Pattern: Google SRE Workbook §5.4 multi-window multi-burn-rate.
  additionalPrometheusRulesMap:
    family-services-slo:
      groups:
        - name: family-services.slo.recording
          interval: 1m
          rules:
            # 30-day availability (used by dashboards)
            - record: slo:plex:availability:ratio_30d
              expr: avg_over_time(up{job="plex"}[30d])
            # mc-monitor drops the server_version label whenever the ping
            # fails, which forks minecraft_status_healthy into a second series
            # whose samples are all 0 — recorded verbatim, that phantom pinned
            # a permanent 0% tile next to the real SLO (seen 2026-08-06).
            # Merge the identity before averaging; max is exact because
            # staleness markers hand over cleanly between the two shapes.
            - record: slo:minecraft:availability:ratio_30d
              expr: avg_over_time((max without (server_version) (minecraft_status_healthy))[30d:5m])
            - record: slo:pihole:availability:ratio_30d
              expr: avg_over_time(up{job="pihole"}[30d])
            - record: slo:nas:availability:ratio_30d
              expr: avg_over_time(up{job="node-exporter-external", hostname="JBNAS01"}[30d])
            - record: slo:tailscale:availability:ratio_30d
              expr: avg_over_time(up{job="tailscale-nodes"}[30d])

            # Burn rate — short windows (for fast-burn alert)
            - record: slo:plex:burn_rate:5m
              expr: (1 - avg_over_time(up{job="plex"}[5m])) / 0.005
            - record: slo:plex:burn_rate:1h
              expr: (1 - avg_over_time(up{job="plex"}[1h])) / 0.005
            - record: slo:minecraft:burn_rate:5m
              expr: (1 - avg_over_time((max without (server_version) (minecraft_status_healthy))[5m:30s])) / 0.01
            - record: slo:minecraft:burn_rate:1h
              expr: (1 - avg_over_time((max without (server_version) (minecraft_status_healthy))[1h:1m])) / 0.01
            - record: slo:pihole:burn_rate:5m
              expr: (1 - avg_over_time(up{job="pihole"}[5m])) / 0.001
            - record: slo:pihole:burn_rate:1h
              expr: (1 - avg_over_time(up{job="pihole"}[1h])) / 0.001
            - record: slo:nas:burn_rate:5m
              expr: (1 - avg_over_time(up{job="node-exporter-external", hostname="JBNAS01"}[5m])) / 0.001
            - record: slo:nas:burn_rate:1h
              expr: (1 - avg_over_time(up{job="node-exporter-external", hostname="JBNAS01"}[1h])) / 0.001
            - record: slo:tailscale:burn_rate:5m
              expr: (1 - avg_over_time(up{job="tailscale-nodes"}[5m])) / 0.01
            - record: slo:tailscale:burn_rate:1h
              expr: (1 - avg_over_time(up{job="tailscale-nodes"}[1h])) / 0.01

            # Burn rate — long windows (for slow-burn alert)
            - record: slo:plex:burn_rate:30m
              expr: (1 - avg_over_time(up{job="plex"}[30m])) / 0.005
            - record: slo:plex:burn_rate:6h
              expr: (1 - avg_over_time(up{job="plex"}[6h])) / 0.005
            - record: slo:minecraft:burn_rate:30m
              expr: (1 - avg_over_time((max without (server_version) (minecraft_status_healthy))[30m:1m])) / 0.01
            - record: slo:minecraft:burn_rate:6h
              expr: (1 - avg_over_time((max without (server_version) (minecraft_status_healthy))[6h:1m])) / 0.01
            - record: slo:pihole:burn_rate:30m
              expr: (1 - avg_over_time(up{job="pihole"}[30m])) / 0.001
            - record: slo:pihole:burn_rate:6h
              expr: (1 - avg_over_time(up{job="pihole"}[6h])) / 0.001
            - record: slo:nas:burn_rate:30m
              expr: (1 - avg_over_time(up{job="node-exporter-external", hostname="JBNAS01"}[30m])) / 0.001
            - record: slo:nas:burn_rate:6h
              expr: (1 - avg_over_time(up{job="node-exporter-external", hostname="JBNAS01"}[6h])) / 0.001
            - record: slo:tailscale:burn_rate:30m
              expr: (1 - avg_over_time(up{job="tailscale-nodes"}[30m])) / 0.01
            - record: slo:tailscale:burn_rate:6h
              expr: (1 - avg_over_time(up{job="tailscale-nodes"}[6h])) / 0.01

        # runbook_url points at the public homelab-observability repo. Burn-rate
        # alerts link the SLO design doc, rule-rationale alerts link the alert
        # design doc, the rest link the runbooks index. Repoint per-alert when
        # dedicated triage runbooks are authored.
        - name: family-services.slo.alerts
          rules:
            # SLI is `up{job="plex"}`, i.e. plex-exporter scrape success. That
            # measures *exporter* health, NOT user-facing Plex reachability.
            # The exporter builds /metrics by querying the Plex API for library
            # and session stats; that call's latency tracks how busy PMS is, so
            # the scrape hits its 10s timeout under playback load and `up` flips
            # to 0 while family streaming is fine (observed 2026-05-21).
            #
            # The real user-facing SLI (blackbox http_plex probe to
            # 192.168.0.202:32400/identity) is `PlexReachabilityBurnFast` in the
            # `plex-streaming-real-sli` rules block below. These alerts are
            # demoted to warning and reworded — kept as a secondary signal on
            # the exporter→Plex-API path.
            - alert: PlexErrorBudgetBurnFast
              expr: slo:plex:burn_rate:1h > 14.4 and slo:plex:burn_rate:5m > 14.4
              for: 2m
              labels: {severity: warning, service: plex}
              annotations:
                summary: "plex-exporter scrape failing fast (exporter SLI, not user-facing Plex)"
                host: "NvidiaShield (192.168.0.202:32400)"
                value: "{{ $value | printf \"%.1f\" }}x error-budget burn rate (1h window)"
                threshold: "fast burn >14.4x, sustained 2m"
                impact: "The plex-exporter to Plex-API path is failing or slow. This is NOT the streaming path — family playback may be perfectly fine. Commonly caused by the exporter /metrics scrape timing out under PMS playback/scan load."
                action: "Verify real Plex first: `curl -sf http://192.168.0.202:32400/identity`. If that works, this is exporter noise — check plex-exporter pod logs and PMS transcode load."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/plex-exporter-burn.md"
            - alert: PlexErrorBudgetBurnSlow
              expr: slo:plex:burn_rate:6h > 6 and slo:plex:burn_rate:30m > 6
              for: 15m
              labels: {severity: warning, service: plex}
              annotations:
                summary: "plex-exporter scrape failing slowly (exporter SLI, not user-facing Plex)"
                host: "NvidiaShield (192.168.0.202:32400)"
                value: "{{ $value | printf \"%.1f\" }}x error-budget burn rate (6h window)"
                threshold: "slow burn >6x, sustained 15m"
                impact: "plex-exporter scrape success has degraded over 6h. Not the streaming path — verify before escalating."
                action: "Check `curl -sf http://192.168.0.202:32400/identity` first; if that works, investigate exporter pod restarts or PMS API slowness."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/plex-exporter-burn.md"

            - alert: MinecraftErrorBudgetBurnFast
              expr: slo:minecraft:burn_rate:1h > 14.4 and slo:minecraft:burn_rate:5m > 14.4
              for: 2m
              labels: {severity: critical, service: minecraft}
              annotations:
                summary: "Minecraft burning SLO budget fast"
                host: "JBVM03 (192.168.0.204)"
                value: "{{ $value | printf \"%.1f\" }}x error-budget burn rate (1h window)"
                threshold: "fast burn >14.4x, sustained 2m"
                impact: "The Minecraft server is not answering server-list-ping; active players are being disconnected."
                action: "Check the minecraft systemd unit on JBVM03 and the JVM heap/GC state."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/minecraft-burn.md"
            - alert: MinecraftErrorBudgetBurnSlow
              expr: slo:minecraft:burn_rate:6h > 6 and slo:minecraft:burn_rate:30m > 6
              for: 15m
              labels: {severity: warning, service: minecraft}
              annotations:
                summary: "Minecraft burning SLO budget slowly"
                host: "JBVM03 (192.168.0.204)"
                value: "{{ $value | printf \"%.1f\" }}x error-budget burn rate (6h window)"
                threshold: "slow burn >6x, sustained 15m"
                impact: "Minecraft availability has degraded over 6h — likely a flapping server or restart loop."
                action: "Investigate JBVM03 logs and ServerStarter restart behaviour."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/minecraft-burn.md"

            # SLI is `up{job="pihole"}`, i.e. pihole-exporter scrape success.
            # That measures *exporter* availability, NOT user-facing DNS
            # reachability. The exporter and pihole-FTL :53 are independent
            # paths; the household can resolve DNS perfectly while these
            # alerts fire. Wording reflects that.
            #
            # The real user-DNS SLI (blackbox dns_pihole probe on UDP/53) now
            # exists as `PiholeDnsBurnFast` in the `pihole-dns-real-sli` rules
            # block below; these warning alerts remain as a secondary signal
            # on the exporter→admin-API path.
            - alert: PiholeErrorBudgetBurnFast
              expr: slo:pihole:burn_rate:1h > 14.4 and slo:pihole:burn_rate:5m > 14.4
              for: 2m
              labels: {severity: warning, service: pihole}
              annotations:
                summary: "pihole-exporter scrape failing fast (exporter SLI, not user-facing DNS)"
                host: "JBDNS01 (192.168.0.205)"
                value: "{{ $value | printf \"%.1f\" }}x error-budget burn rate (1h window)"
                threshold: "fast burn >14.4x, sustained 2m"
                impact: "The pihole-exporter to admin-API path is failing. This is NOT the LAN DNS path — household DNS may be perfectly fine."
                action: "Verify real DNS first: `dig @192.168.0.205 +short google.com`. Then check the pihole-exporter pod and the pihole-FTL admin API (port 80) on the LXC."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/pihole-exporter-burn.md"
            - alert: PiholeErrorBudgetBurnSlow
              expr: slo:pihole:burn_rate:6h > 6 and slo:pihole:burn_rate:30m > 6
              for: 15m
              labels: {severity: warning, service: pihole}
              annotations:
                summary: "pihole-exporter scrape failing slowly (exporter SLI, not user-facing DNS)"
                host: "JBDNS01 (192.168.0.205)"
                value: "{{ $value | printf \"%.1f\" }}x error-budget burn rate (6h window)"
                threshold: "slow burn >6x, sustained 15m"
                impact: "pihole-exporter scrape success has degraded over 6h. Not the LAN DNS path — verify before escalating."
                action: "Check `dig @192.168.0.205 +short google.com` first; if that works, investigate exporter pod restarts or admin-API slowness."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/pihole-exporter-burn.md"

            - alert: NasErrorBudgetBurnFast
              expr: slo:nas:burn_rate:1h > 14.4 and slo:nas:burn_rate:5m > 14.4
              for: 2m
              labels: {severity: critical, service: nas}
              annotations:
                summary: "NAS unreachable — burning SLO budget fast"
                host: "JBNAS01 (192.168.0.201)"
                value: "{{ $value | printf \"%.1f\" }}x error-budget burn rate (1h window)"
                threshold: "fast burn >14.4x, sustained 2m"
                impact: "node-exporter on JBNAS01 is not responding. SMB shares, Plex media, and weekly rsync backups are all affected."
                action: "Open the Proxmox console on JBSRV01 and check the JBNAS01 VM (VMID 101) — possibly the unclean-shutdown pattern recurring."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/nas-burn.md"
            - alert: NasErrorBudgetBurnSlow
              expr: slo:nas:burn_rate:6h > 6 and slo:nas:burn_rate:30m > 6
              for: 15m
              labels: {severity: warning, service: nas}
              annotations:
                summary: "NAS reachability degraded over 6h"
                host: "JBNAS01 (192.168.0.201)"
                value: "{{ $value | printf \"%.1f\" }}x error-budget burn rate (6h window)"
                threshold: "slow burn >6x, sustained 15m"
                impact: "Intermittent NAS scrape failures over 6h; SMB and backup reliability are at risk."
                action: "Check the JBSRV01 to JBNAS01 network path and the TrueNAS dashboard for ZFS pool errors or panic logs."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/nas-burn.md"

            - alert: TailscaleNodeBurnFast
              expr: slo:tailscale:burn_rate:1h > 14.4 and slo:tailscale:burn_rate:5m > 14.4
              for: 2m
              labels: {severity: critical, service: tailscale}
              annotations:
                summary: "Tailscale node {{ $labels.hostname }} burning SLO budget fast"
                host: "{{ $labels.hostname }}"
                value: "{{ $value | printf \"%.1f\" }}x error-budget burn rate (1h window)"
                threshold: "fast burn >14.4x, sustained 2m"
                impact: "tailscaled --debug metrics on {{ $labels.hostname }} are not responding; remote access and any subnet routes it advertises are impaired."
                action: "Check the tailscaled service on {{ $labels.hostname }} and the Tailscale admin console."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/tailscale-burn.md"
            - alert: TailscaleNodeBurnSlow
              expr: slo:tailscale:burn_rate:6h > 6 and slo:tailscale:burn_rate:30m > 6
              for: 15m
              labels: {severity: warning, service: tailscale}
              annotations:
                summary: "Tailscale node {{ $labels.hostname }} burning SLO budget slowly (>6x for 6h)"
                host: "{{ $labels.hostname }}"
                value: "{{ $value | printf \"%.1f\" }}x error-budget burn rate (6h window)"
                threshold: "slow burn >6x, sustained 15m"
                impact: "Tailscale node {{ $labels.hostname }} has been flapping over 6h — often DERP relay churn or local interface state."
                action: "Check the tailscaled journal and the netstack_dropped_packets metric for {{ $labels.hostname }}."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/tailscale-burn.md"

    # SMART drive health. Don't alert on smartctl_exit_status raw — it's a
    # bitfield where bit 6 (=64) means "any historical error log entry", which
    # fires for life on drives that had a single transient read error years
    # ago. Instead: page on the actionable attributes directly, and let the
    # critical SmartDriveStatusFailed catch the manufacturer-threshold flip.
    smart-disk-failures:
      groups:
        - name: smart.disk.alerts
          rules:
            - alert: SmartDriveAttributesBad
              expr: smartctl_device_attribute{attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector|Offline_Uncorrectable",attribute_value_type="raw"} > 0
              for: 10m
              labels: {severity: warning, service: storage}
              annotations:
                summary: "SMART attribute {{ $labels.attribute_name }} = {{ $value }} on {{ $labels.device }}"
                host: "JBSRV01 (192.168.0.200)"
                value: "{{ $labels.attribute_name }} raw = {{ $value }}"
                threshold: "any non-zero raw value, sustained 10m"
                impact: "Drive {{ $labels.device }} ({{ $labels.model_name }}) shows real media wear or damage. Left unattended this trends toward drive failure and data loss."
                action: "Run `smartctl -a /dev/{{ $labels.device }}` on JBSRV01 to confirm the trend before planning replacement."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/smart-drive-warning.md"
            - alert: SmartSsdLifeLeftLow
              expr: smartctl_device_attribute{attribute_name=~"SSD_Life_Left|Percent_Lifetime_Remain|Media_Wearout_Indicator",attribute_value_type="value"} < 5
              for: 1h
              labels: {severity: warning, service: storage}
              annotations:
                summary: "SSD {{ $labels.device }} wear at {{ $value }}% life remaining"
                host: "JBSRV01 (192.168.0.200)"
                value: "{{ $value }}% life remaining"
                threshold: "below 5% life remaining, sustained 1h"
                impact: "SSD {{ $labels.device }} ({{ $labels.model_name }}) is near end of life. Once it crosses the manufacturer threshold the critical SmartDriveStatusFailed alert fires."
                action: "Plan replacement of {{ $labels.device }} on JBSRV01; identify which pool or VM uses it first."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/smart-drive-warning.md"
            - alert: SmartDriveStatusFailed
              expr: smartctl_device_smart_status == 0
              for: 5m
              labels: {severity: critical, service: storage}
              annotations:
                summary: "SMART status FAILED on {{ $labels.device }} ({{ $labels.model_name }}) — drive is dying"
                host: "JBSRV01 (192.168.0.200)"
                value: "SMART overall-health = FAILED"
                threshold: "smart_status reports FAILED, sustained 5m"
                impact: "Drive {{ $labels.device }} has crossed a manufacturer threshold and is expected to fail soon. Data on it is at risk."
                action: "Replace {{ $labels.device }} immediately if it holds data; check which pool or VM uses it first."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/smart-drive-failed.md"

    # Filesystem space across the fleet. No instance filter — these evaluate
    # per series, so every node_exporter target (all 6 hosts) is covered with
    # no per-host config. Added 2026-05-20 after JBVM02 silently filled its
    # root disk to 98% with no alert in place.
    #
    # fstype excludes network/remote filesystems (cifs, nfs, nfs4, fuse.*,
    # smb3, 9p): a client host must not page on a server's free space, and
    # client-side SMB/NFS statfs is transiently bogus during session
    # reconnects. The NAS pool's own capacity is still alerted — JBNAS01's
    # node_exporter reports JBNAS_MEDIA as a local filesystem on JBNAS01.
    # Added 2026-05-20 after JBVM01's CIFS /mnt/nas-media phantom-fired both
    # rules (incident 2026-05-20-jbvm01-phantom-nas-media-fs-alert.md).
    node-disk-space:
      groups:
        - name: node.disk.alerts
          rules:
            - alert: NodeFilesystemLow
              expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|cifs|nfs|nfs4|fuse.*|smb3|9p",mountpoint!~"/(run|boot/efi).*"} / node_filesystem_size_bytes) * 100 < 15
              for: 1h
              labels: {severity: warning, service: storage}
              annotations:
                summary: "{{ $labels.instance }} {{ $labels.mountpoint }} at {{ $value | printf \"%.0f\" }}% free"
                host: "{{ $labels.instance }}"
                value: "{{ $value | printf \"%.1f\" }}% free on {{ $labels.mountpoint }}"
                threshold: "below 15% free, sustained 1h"
                impact: "Filesystem {{ $labels.mountpoint }} is trending toward full. If it fills, writes fail and services on the host can crash."
                action: "Run `df -h` on {{ $labels.instance }}; clear caches and logs or extend the LV."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/node-filesystem.md"
            - alert: NodeFilesystemCritical
              expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|cifs|nfs|nfs4|fuse.*|smb3|9p",mountpoint!~"/(run|boot/efi).*"} / node_filesystem_size_bytes) * 100 < 5
              for: 15m
              labels: {severity: critical, service: storage}
              annotations:
                summary: "{{ $labels.instance }} {{ $labels.mountpoint }} critically full ({{ $value | printf \"%.0f\" }}% free)"
                host: "{{ $labels.instance }}"
                value: "{{ $value | printf \"%.1f\" }}% free on {{ $labels.mountpoint }}"
                threshold: "below 5% free, sustained 15m"
                impact: "Filesystem {{ $labels.mountpoint }} is nearly full — writes will start failing and services may crash on the next disk write."
                action: "Free space now: `df -h {{ $labels.mountpoint }}` on {{ $labels.instance }}, clear caches, or extend the LV."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/node-filesystem.md"

    # Hypervisor storage allocation, from PVE Exporter. Deliberately separate
    # from node.disk.alerts above: that rule watches filesystems *inside* hosts
    # and cannot see a Proxmox storage at all.
    #
    # The thresholds are lower than they look because `local-lvm` is an
    # LVM-thin pool, where "full" is categorically worse than a full
    # filesystem. Guests are over-provisioned against it (198G provisioned into
    # a 195G pool as of 2026-08), so at 100% allocation *every guest* takes I/O
    # errors at once, and deleting files inside a guest does not help unless
    # discard reaches the pool. Recovery needs the hypervisor, so this must
    # page well before the cliff rather than at it.
    #
    # Added after the 2026-08-08 incident, where the pool reached 87.83%
    # allocated with nothing watching it and was found by accident.
    pve-storage-capacity:
      groups:
        - name: pve.storage.alerts
          rules:
            - alert: PveStorageAllocationHigh
              expr: 100 * pve_disk_usage_bytes{id=~"storage/.*"} / pve_disk_size_bytes > 75
              for: 1h
              labels: {severity: warning, service: storage}
              annotations:
                summary: "Proxmox storage {{ $labels.id }} at {{ $value | printf \"%.0f\" }}% allocated"
                host: "{{ $labels.hostname }} ({{ $labels.instance }})"
                value: "{{ $value | printf \"%.1f\" }}% allocated"
                threshold: "above 75% allocated, sustained 1h"
                impact: "Headroom on a hypervisor storage is shrinking. For the thin pools (local-lvm, local-lvm-m2) this is the early warning for a condition that takes every guest down at once, and thin pools only ever grow unless the guests discard."
                action: "On JBSRV01: `pvesm status` and `lvs -o lv_name,data_percent,metadata_percent`. If a thin pool is the offender, check `qm config <vmid> | grep scsi0` shows `discard=on` for each guest, then run `fstrim -av` in the guest (or `pct fstrim <id>` for an LXC) and re-measure with `lvs`."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/pve-storage-capacity.md"
            - alert: PveStorageAllocationCritical
              expr: 100 * pve_disk_usage_bytes{id=~"storage/.*"} / pve_disk_size_bytes > 85
              for: 15m
              labels: {severity: critical, service: storage}
              annotations:
                summary: "Proxmox storage {{ $labels.id }} critically allocated ({{ $value | printf \"%.0f\" }}%)"
                host: "{{ $labels.hostname }} ({{ $labels.instance }})"
                value: "{{ $value | printf \"%.1f\" }}% allocated"
                threshold: "above 85% allocated, sustained 15m"
                impact: "On a thin pool this is close to the cliff: at 100% every guest backed by it takes simultaneous I/O errors, and guests cannot recover themselves. On a directory or NFS storage, backups and new disks will start failing."
                action: "Reclaim now, do not investigate first. `lvs -o lv_name,data_percent` on JBSRV01 to find the largest consumers, then `fstrim -av` inside each guest that has `discard=on`. Guests missing `discard=on` need `qm set <vmid> --scsi0 <existing>,discard=on,ssd=1` (preserve every existing option; `qm set` drops what you omit) and a stop/start."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/pve-storage-capacity.md"

    # Host resource pressure across the fleet, measured by kernel PSI (Pressure
    # Stall Information) — the fraction of wall-clock time tasks spend stalled
    # waiting on memory or I/O. PSI is used deliberately instead of a
    # memory-utilisation alert: on this fleet 90%+ RAM use is normal and
    # healthy (ZFS ARC on JBNAS01, the Minecraft JVM heap on JBVM03, guest
    # allocation on the JBSRV01 hypervisor), and a MemAvailable-based alert
    # cannot distinguish that from genuine exhaustion. PSI fires only on real
    # contention. PSI may be absent inside the JBDNS01 LXC — harmless.
    node-resource-pressure:
      groups:
        - name: node.resource.alerts
          rules:
            - alert: NodeMemoryThrottled
              expr: rate(node_pressure_memory_stalled_seconds_total[5m]) > 0.10
              for: 15m
              labels: {severity: warning, service: compute}
              annotations:
                summary: "{{ $labels.instance }} memory-throttled {{ $value | humanizePercentage }} of the time"
                host: "{{ $labels.instance }}"
                value: "{{ $value | humanizePercentage }} of wall-clock time fully stalled on memory"
                threshold: "PSI full-stall rate >10% over 5m, sustained 15m"
                impact: "{{ $labels.instance }} is memory-throttled — tasks are stalling for memory, so the host is slow or unresponsive."
                action: "Check for swap thrashing or a runaway allocation on {{ $labels.instance }} (`free -h`, `ps aux --sort=-%mem`)."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/node-resource-pressure.md"
            # Three-gated: fire only on high I/O stall WITH low local-disk
            # throughput WITH a local block device actually saturated. Each gate
            # removes a class of false positive:
            #   1. PSI io full-stall >10% — there is real stalling.
            #   2. local throughput <30 MB/s — exclude legitimate bulk I/O. High
            #      stall + high throughput is a healthy host moving data (e.g.
            #      JBNAS01 media ingest over SMB, observed 2026-06-01 at ~125 MB/s,
            #      pools healthy, dmesg clean); paging on that trains the on-call
            #      to ignore the NAS I/O warning.
            #   3. local-disk busy fraction >0.5 (io_time) — exclude stalls whose
            #      source is NOT a local device. PSI io is system-wide and counts
            #      network-FS waits (CIFS/NFS), but the throughput term only sees
            #      local block devices, so a host stalling on a CIFS mount shows
            #      high PSI + ~0 local throughput and false-fires. Added
            #      2026-06-02 after JBVM01 paged 2x while qBittorrent did heavy
            #      I/O against its /mnt/nas-media CIFS share: PSI 20%, local
            #      throughput ~4 MB/s, but local io_time only 0.03 (disk idle).
            #      A genuinely slow/failing device is the opposite — saturated
            #      (io_time near 1, stuck/timing-out I/O) at low throughput; the
            #      NAS measured 1.39 doing real work. 0.5 sits in that gap.
            # What still fires correctly: a failing local/backing device (busy,
            # low throughput), and heavy swap thrash (paging keeps the local disk
            # busy — JBVM01's earlier 54% episode, fixed by a RAM bump).
            # Tradeoff unchanged: a drive failing *during* heavy ingest (other
            # RAIDZ members carrying throughput) is masked here — surfaces via
            # zpool/dmesg, not PSI.
            - alert: NodeIOThrottled
              expr: |-
                rate(node_pressure_io_stalled_seconds_total[5m]) > 0.10
                  and on(instance)
                sum by(instance) (
                    rate(node_disk_read_bytes_total{device=~"sd.*|nvme.*|vd.*|xvd.*"}[5m])
                  + rate(node_disk_written_bytes_total{device=~"sd.*|nvme.*|vd.*|xvd.*"}[5m])
                ) < 3e7
                  and on(instance)
                sum by(instance) (
                    rate(node_disk_io_time_seconds_total{device=~"sd.*|nvme.*|vd.*|xvd.*"}[5m])
                ) > 0.5
              for: 15m
              labels: {severity: warning, service: storage}
              annotations:
                summary: "{{ $labels.instance }} I/O-throttled {{ $value | humanizePercentage }} of the time with a saturated local disk at low throughput"
                host: "{{ $labels.instance }}"
                value: "{{ $value | humanizePercentage }} of wall-clock time fully stalled on disk I/O, with a local disk busy >50% but throughput <30 MB/s"
                threshold: "PSI full-stall >10% over 5m AND local throughput <30 MB/s AND local-disk busy >50%, sustained 15m"
                impact: "{{ $labels.instance }} has a local disk saturated while moving little data — points to a slow/failing device timing out, or heavy swap paging. (Legitimate bulk I/O and network-FS/CIFS stalls are intentionally excluded.)"
                action: "Rule out memory pressure first: `free -h` / `vmstat 1` (high si/so = swap thrash, not a device). On a NAS, rule out a benign bulk writer: `smbstatus --locks`. Then look for a slow device: `zpool status` (errors/resilver), `dmesg -T | grep -iE 'ata|reset|timeout|error'`, `zpool iostat -vl 1` (a single member with high disk_wait). The runbook has the drive-hang and benign-ingest discriminators."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/node-resource-pressure.md"
            - alert: Jbvm02MaintenanceStale
              expr: time() - maintenance_last_success_timestamp_seconds{name="jbvm02-maintenance"} > 691200
              for: 1h
              labels: {severity: warning, service: platform}
              annotations:
                summary: "JBVM02 weekly disk-hygiene maintenance has not run in over 8 days"
                host: "JBVM02 (192.168.0.203)"
                value: "last successful run {{ $value | humanizeDuration }} ago"
                threshold: "no maintenance success for >8 days"
                impact: "The weekly disk sweep on JBVM02 has stopped; disk hygiene will drift and the root filesystem can fill unnoticed again."
                action: "Check `systemctl status jbvm02-maintenance.timer` on JBVM02."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/jbvm02-maintenance-stale.md"

    # Backup heartbeat staleness. Each backup script writes
    # backup_last_success_timestamp_seconds{name="..."} via the node_exporter
    # textfile collector on success; if a script fails or stops scheduling,
    # the value goes stale and these alerts fire. Two thresholds because
    # cadence differs: daily/sub-daily scripts vs weekly vzdump jobs.
    # Added 2026-05-28 after the 2026-05-24 vzdump incident showed VM 101's
    # backup had been silently failing for 3 weeks with no telemetry.
    backup-heartbeat-stale:
      groups:
        - name: backup.heartbeat.alerts
          rules:
            # Daily / sub-daily backup + liveness heartbeats (rsync-style
            # config backups + mc-world-backup rolling slot + the every-minute
            # nas-media-pipeline ingest cron). 36h covers daily + a 12h grace
            # window without being so loose that a real outage hides.
            - alert: BackupHeartbeatStale
              expr: time() - backup_last_success_timestamp_seconds{name!~"vzdump-.*"} > 129600
              for: 1h
              labels: {severity: warning, service: platform}
              annotations:
                summary: "Backup {{ $labels.name }} on {{ $labels.hostname }} has not succeeded in >36h"
                host: "{{ $labels.hostname }} ({{ $labels.instance }})"
                value: "last successful run {{ $value | humanizeDuration }} ago"
                threshold: "no backup success for >36h (daily-cadence scripts get a 12h grace)"
                impact: "Job {{ $labels.name }} has stopped writing success heartbeats. Backup jobs: data is at risk of an undetected protection gap. Liveness jobs (e.g. nas-media-pipeline): the cron is wedged or disabled."
                action: "Check the script's cron/timer on {{ $labels.hostname }} and `/var/log/{{ $labels.name }}.log` (or `journalctl -t {{ $labels.name }}`)."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/backup-heartbeat-stale.md"
            # Per-guest vzdump heartbeats. Written by /usr/local/bin/vzdump-heartbeat.sh
            # on JBSRV01 (Proxmox --script hook). Job runs Sun 04:00; 8d window =
            # weekly cadence + 1d grace. Series only exists for guests that have
            # completed at least one backup post-2026-05-28 hook install.
            - alert: VzdumpHeartbeatStale
              expr: time() - backup_last_success_timestamp_seconds{name=~"vzdump-.*"} > 691200
              for: 1h
              labels: {severity: warning, service: platform}
              annotations:
                summary: "{{ $labels.name }} has not completed a successful backup in >8d"
                host: "JBSRV01 (192.168.0.200)"
                value: "last successful vzdump {{ $value | humanizeDuration }} ago"
                threshold: "no vzdump success for >8 days (weekly cadence + 1d grace)"
                impact: "Per-guest backup for {{ $labels.name }} has stopped. The matching guest will have no fresh offsite copy after the 2-file retention window cycles."
                action: "On JBSRV01: check the latest `/var/log/vzdump/*.log` for the matching VMID, the `script` line in `/etc/pve/jobs.cfg`, and `mountpoint /mnt/nas-backups`."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/backup-heartbeat-stale.md"

    # Media-integrity corruption reports. The verify-gated ingest pipeline
    # (nas-media-pipeline.sh on JBNAS01) writes one report file per confirmed
    # corrupt download to /srv/media-corrupt-reports on JBVM01, and exports the
    # count as media_corrupt_reports_count via the NAS node_exporter textfile
    # collector. >0 means there is a download needing re-acquisition from a
    # different source. The alert auto-resolves when the operator deletes the
    # report file(s) after re-acquiring, since the next pipeline run (~60s)
    # re-counts and the gauge returns to 0.
    media-corrupt-reports:
      groups:
        - name: media.integrity.alerts
          rules:
            - alert: MediaCorruptionDetected
              expr: media_corrupt_reports_count > 0
              for: 2m
              labels: {severity: warning, service: platform}
              annotations:
                summary: "{{ $value }} corrupt media download(s) awaiting re-acquisition"
                host: "JBVM01 (192.168.0.206)"
                value: "{{ $value }} unresolved corruption report(s)"
                threshold: "any confirmed-corrupt download (2-pass decode scan) holds the alert open"
                impact: "One or more downloads failed decode verification and were NOT added to Plex (torrent stopped + files deleted). The media is missing from the library until re-acquired from a different source."
                action: "On JBVM01, read /srv/media-corrupt-reports/corrupt-*.txt for the download name + release group, re-acquire from a DIFFERENT source, then delete the report file(s) to clear this alert."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/media-corruption-detected.md"

    # ZFS pool health. Excludes boot-pool which is a SOLARIS-style mirror that
    # reports per-vdev state (false-positive on transient resilvers).
    zfs-pool-health:
      groups:
        - name: zfs.pool.alerts
          rules:
            - alert: ZfsPoolNotOnline
              expr: node_zfs_zpool_state{zpool!="boot-pool", state!="online"} == 1
              for: 5m
              labels: {severity: critical, service: storage}
              annotations:
                summary: "ZFS pool {{ $labels.zpool }} on {{ $labels.hostname }} is {{ $labels.state }}"
                host: "{{ $labels.hostname }}"
                value: "pool {{ $labels.zpool }} state = {{ $labels.state }}"
                threshold: "any pool except boot-pool not ONLINE, sustained 5m"
                impact: "Pool {{ $labels.zpool }} is not healthy. JBNAS_MEDIA is a stripe pool — DEGRADED there means data loss is imminent."
                action: "Run `zpool status -v {{ $labels.zpool }}` on {{ $labels.hostname }} to triage."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/zfs-pool-not-online.md"

    # Real user-facing Pi-hole DNS SLI via blackbox-exporter (charts/
    # prometheus-blackbox-exporter). SLI is probe_success{job="blackbox-dns-pihole"},
    # which is an actual UDP/53 DNS lookup against 192.168.0.205, distinct
    # from the exporter-scrape SLI `up{job="pihole"}` (kept for the slow-burn
    # warning above). Closes the TODO at the PiholeErrorBudgetBurn comment.
    pihole-dns-real-sli:
      groups:
        - name: pihole-dns.slo.recording
          interval: 1m
          rules:
            # 99.9% SLO target → error budget = 0.001
            - record: slo:pihole_dns:availability:ratio_30d
              expr: avg_over_time(probe_success{job="blackbox-dns-pihole"}[30d])
            - record: slo:pihole_dns:burn_rate:5m
              expr: (1 - avg_over_time(probe_success{job="blackbox-dns-pihole"}[5m])) / 0.001
            - record: slo:pihole_dns:burn_rate:30m
              expr: (1 - avg_over_time(probe_success{job="blackbox-dns-pihole"}[30m])) / 0.001
            - record: slo:pihole_dns:burn_rate:1h
              expr: (1 - avg_over_time(probe_success{job="blackbox-dns-pihole"}[1h])) / 0.001
            - record: slo:pihole_dns:burn_rate:6h
              expr: (1 - avg_over_time(probe_success{job="blackbox-dns-pihole"}[6h])) / 0.001

        - name: pihole-dns.slo.alerts
          rules:
            # Critical: this is the household-impacting signal. Unlike the
            # exporter-based PiholeErrorBudgetBurnFast (warning), failure
            # here means real DNS is broken for every device on the LAN.
            - alert: PiholeDnsBurnFast
              expr: slo:pihole_dns:burn_rate:1h > 14.4 and slo:pihole_dns:burn_rate:5m > 14.4
              for: 2m
              labels: {severity: critical, service: pihole}
              annotations:
                summary: "household DNS unreachable (blackbox dns_pihole probe to 192.168.0.205:53)"
                host: "JBDNS01 (192.168.0.205)"
                value: "{{ $value | printf \"%.1f\" }}x error-budget burn rate (1h window)"
                threshold: "fast burn >14.4x, sustained 2m"
                impact: "Real user-facing DNS is failing — every device on the LAN cannot resolve names. This is the household-impacting signal, independent of the pihole-exporter scrape."
                action: "1) `dig @192.168.0.205 +short google.com` from another host; 2) `systemctl status pihole-FTL` on JBDNS01; 3) check upstream resolvers in the Pi-hole admin UI; 4) verify JBDNS01 networking."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/pihole-dns-burn.md"

    # Real user-facing Plex SLI via blackbox-exporter (charts/
    # prometheus-blackbox-exporter, module http_plex, Probe plex-http). SLI is
    # probe_success{job="blackbox-plex"} — an actual HTTP GET of Plex Media
    # Server's /identity endpoint on 192.168.0.202:32400, distinct from the
    # exporter-scrape SLI `up{job="plex"}` (kept for the demoted warnings
    # above). /identity does no library/session query, so this signal is
    # decoupled from PMS playback load — it fires only on real outages.
    plex-streaming-real-sli:
      groups:
        - name: plex-streaming.slo.recording
          interval: 1m
          rules:
            # 99.5% SLO target → error budget = 0.005 (matches the stated Plex SLO)
            - record: slo:plex_http:availability:ratio_30d
              expr: avg_over_time(probe_success{job="blackbox-plex"}[30d])
            - record: slo:plex_http:burn_rate:5m
              expr: (1 - avg_over_time(probe_success{job="blackbox-plex"}[5m])) / 0.005
            - record: slo:plex_http:burn_rate:30m
              expr: (1 - avg_over_time(probe_success{job="blackbox-plex"}[30m])) / 0.005
            - record: slo:plex_http:burn_rate:1h
              expr: (1 - avg_over_time(probe_success{job="blackbox-plex"}[1h])) / 0.005
            - record: slo:plex_http:burn_rate:6h
              expr: (1 - avg_over_time(probe_success{job="blackbox-plex"}[6h])) / 0.005

            # --- De-noising + maintenance window (added 2026-06-13) -----------
            # 7 days of probe history showed the /identity SLI was red 3.5% of
            # the time, but 40 of ~64 outage "episodes" were single 30s samples
            # (network blips, not real outages) and most multi-minute outages
            # clustered 02:00–05:00 local — the Shield's nightly OTA reboot
            # window. Raw 30d availability sat at 96.5% as a result. These rules
            # separate noise / expected-maintenance / genuine outage.

            # Maintenance window indicator (1 = inside it). hour() is UTC, so
            # this is 01:00–05:00 UTC = 02:00–06:00 BST / 01:00–05:00 GMT. The
            # 4h UTC span deliberately covers the observed 02:00–05:00 reboot
            # cluster in both DST states; widen here if reboots drift.
            - record: plex:maintenance_window
              expr: (hour() >= bool 1) * (hour() < bool 5)

            # Hysteresis: hard_down = no successful /identity probe for a full
            # 3 minutes. This is the trustworthy "Plex is actually down" signal
            # (dashboards, notifications) — it ignores every single-sample blip.
            - record: plex:hard_down
              expr: max_over_time(probe_success{job="blackbox-plex"}[3m]) == bool 0

            # Service-hours availability: probe_success with the maintenance
            # window carved out (the series simply has no samples 02:00–06:00).
            # avg_over_time then averages only out-of-window samples, giving an
            # SLO that reflects waking-hours reality instead of OTA reboots.
            - record: plex_http:up_svchours
              expr: probe_success{job="blackbox-plex"} unless on() (plex:maintenance_window == 1)
            - record: slo:plex_http:availability:ratio_30d_svchours
              expr: avg_over_time(plex_http:up_svchours[30d])

            # L3 library probe (charts/plex-library-probe): authenticated GET of
            # /library/sections, which touches the PMS DB + backing media store.
            # hard_down here with /identity UP = "green but broken" (SMB wedge).
            - record: plex:library_hard_down
              expr: max_over_time(plex_library_probe_success[3m]) == bool 0

        - name: plex-streaming.slo.alerts
          rules:
            # Critical: this is the household-impacting signal. Unlike the
            # exporter-based PlexErrorBudgetBurnFast (warning), failure here
            # means Plex Media Server is genuinely unreachable for family
            # devices, not just slow to answer the exporter.
            # Both reachability alerts are gated with `unless ... maintenance_
            # window == 1`: a routine 02:00–06:00 Shield OTA reboot no longer
            # pages. Genuine maintenance-hours breakage is still caught by
            # PlexLibraryUnreadable (library down while /identity up) and
            # PlexRebootStorm (abnormal reboot clusters), which are NOT gated.
            - alert: PlexReachabilityBurnFast
              expr: (slo:plex_http:burn_rate:1h > 14.4 and slo:plex_http:burn_rate:5m > 14.4) unless on() (plex:maintenance_window == 1)
              for: 2m
              labels: {severity: critical, service: plex}
              annotations:
                summary: "Plex unreachable (blackbox http probe to 192.168.0.202:32400/identity)"
                host: "NvidiaShield (192.168.0.202:32400)"
                value: "{{ $value | printf \"%.1f\" }}x error-budget burn rate (1h window)"
                threshold: "fast burn >14.4x, sustained 2m (suppressed 02:00–06:00 BST maintenance window)"
                impact: "Real user-facing Plex is failing — family devices cannot reach the media server. This is the household-impacting signal, independent of the plex-exporter scrape."
                action: "1) `curl -sf http://192.168.0.202:32400/identity` from another host; 2) check the Shield is powered on and on the network; 3) check Plex Media Server on the Shield; 4) if PMS is up but erroring, check the JBNAS01 SMB media share."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/plex-reachability-burn.md"
            - alert: PlexReachabilityBurnSlow
              expr: (slo:plex_http:burn_rate:6h > 6 and slo:plex_http:burn_rate:30m > 6) unless on() (plex:maintenance_window == 1)
              for: 15m
              labels: {severity: warning, service: plex}
              annotations:
                summary: "Plex reachability degraded (blackbox http probe to 192.168.0.202:32400/identity)"
                host: "NvidiaShield (192.168.0.202:32400)"
                value: "{{ $value | printf \"%.1f\" }}x error-budget burn rate (6h window)"
                threshold: "slow burn >6x, sustained 15m (suppressed 02:00–06:00 BST maintenance window)"
                impact: "Real user-facing Plex has been intermittently unreachable over 6h; family sessions are likely affected."
                action: "Check the Shield host, the network path to it, and PMS stability; correlate with the JBNAS01 SMB media share."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/plex-reachability-burn.md"

            # The sharpest "erroring" signal: Plex answers /identity (L2 up) but
            # its library is unreadable (L3 down) — the failure mode the /identity
            # probe is blind to (SMB mount wedge, PMS DB corruption). Critical and
            # deliberately NOT maintenance-gated; during a reboot /identity is
            # also down so the right-hand clause is false and this stays quiet.
            - alert: PlexLibraryUnreadable
              expr: max_over_time(plex_library_probe_success[5m]) == 0 and on() (max_over_time(probe_success{job="blackbox-plex"}[5m]) == 1)
              for: 5m
              labels: {severity: critical, service: plex}
              annotations:
                summary: "Plex is up but its library is unreadable (GET /library/sections failing)"
                host: "NvidiaShield (192.168.0.202:32400)"
                value: "plex_library_probe_success = 0 while /identity is up"
                threshold: "library probe failing 5m with PMS reachable"
                impact: "Plex Media Server answers but cannot read its library/media — playback fails for everyone even though the reachability probe is green. Classic NAS SMB-mount wedge on the Shield (incident 2026-06-07)."
                action: "1) On the Shield, check the SMB mount to the Plex media share (remount if wedged); 2) `curl -s -H 'X-Plex-Token: <token>' http://192.168.0.202:32400/library/sections`; 3) check JBNAS01 SMB/NAS health."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/plex-library-unreadable.md"

            # Abnormal reboot clustering (e.g. a failed OTA update retry-looping).
            # resets() counts 1→0 drops of the reachability probe; >4 in 3h is a
            # storm, not the single nightly reboot. Catches the maintenance-window
            # case the gated alerts above intentionally suppress.
            - alert: PlexRebootStorm
              expr: resets(probe_success{job="blackbox-plex"}[3h]) > 4
              for: 5m
              labels: {severity: warning, service: plex}
              annotations:
                summary: "Plex/Shield rebooting repeatedly ({{ $value | printf \"%.0f\" }} drops in 3h)"
                host: "NvidiaShield (192.168.0.202:32400)"
                value: "{{ $value | printf \"%.0f\" }} reachability drops in the last 3h"
                threshold: ">4 probe drops in 3h"
                impact: "The Shield is going up and down far more than a single nightly OTA reboot — likely a failed update retry-looping or a hardware/network fault. Family Plex is repeatedly interrupted."
                action: "Check the Shield's system updates / reboot history; if an OTA is failing, intervene on the device. Correlate with JBDNS01 OTA-reboot fingerprint."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/plex-reboot-storm.md"

            # Monitoring-coverage alert (not user-facing): if Tautulli stops
            # reporting, session/transcode visibility goes dark. Low urgency.
            - alert: TautulliMonitoringDown
              expr: min_over_time(tautulli_up[15m]) == 0 or absent(tautulli_up)
              for: 30m
              labels: {severity: warning, service: tautulli}
              annotations:
                summary: "Tautulli session metrics unavailable (monitoring gap, not a Plex outage)"
                host: "JBK8S01 (192.168.0.207) → tautulli.monitoring.svc:8181"
                value: "tautulli_up = 0 or metric absent for 30m"
                threshold: "tautulli_up == 0 / absent, sustained 30m"
                impact: "Active-session, transcode and bandwidth metrics for Plex are not being collected. This is a visibility gap, not a user-facing Plex failure — the reachability and library SLIs are unaffected."
                action: "Check the tautulli and tautulli-exporter pods in the monitoring namespace; verify Tautulli's API key and PMS connection."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/tautulli-monitoring-down.md"

    # Loki / Promtail health. Both are scraped via ServiceMonitor enabled in
    # charts/loki/values.yaml and charts/promtail/values.yaml. Without these
    # alerts a silent log-ingestion failure would leave dashboards quietly
    # blank.
    logging-stack-health:
      groups:
        - name: logging.alerts
          rules:
            - alert: LokiDown
              expr: up{job="loki"} == 0
              for: 5m
              labels: {severity: warning, service: loki}
              annotations:
                summary: "Loki is down — log ingestion stopped"
                host: "JBK8S01 (192.168.0.207)"
                value: "Loki scrape failing (up = 0)"
                threshold: "up{job=loki} == 0, sustained 5m"
                impact: "Log ingestion has stopped. Log dashboards go blank and Promtail buffers until disk pressure builds."
                action: "Check `kubectl -n monitoring describe pod -l app.kubernetes.io/name=loki` and the loki PVC."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/logging-stack-down.md"
            - alert: PromtailDown
              expr: up{job="promtail"} == 0
              for: 5m
              labels: {severity: warning, service: promtail}
              annotations:
                summary: "Promtail down on {{ $labels.instance }} — journal not shipping to Loki"
                host: "{{ $labels.instance }}"
                value: "Promtail scrape failing (up = 0)"
                threshold: "up{job=promtail} == 0, sustained 5m"
                impact: "Journal entries from {{ $labels.instance }} are no longer reaching Loki — that host's logs go dark."
                action: "Check the promtail pod on {{ $labels.instance }} and its position file under /run/promtail/."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/logging-stack-down.md"

    # Tracing stack health. Tempo (trace store) and the OTel Collector (trace
    # gateway) are scraped via ServiceMonitor. The collector also fronts an OTLP
    # NodePort (34317/34318) for off-cluster producers like the NAS media
    # pipeline; if it is down those submissions fail silently, so alert on it.
    tracing-stack-health:
      groups:
        - name: tracing.alerts
          rules:
            - alert: OtelCollectorDown
              expr: up{job="otel-collector"} == 0
              for: 5m
              labels: {severity: warning, service: otel-collector}
              annotations:
                summary: "OTel Collector is down — trace ingestion stopped"
                host: "JBK8S01 (192.168.0.207)"
                value: "OTel Collector scrape failing (up = 0)"
                threshold: "up{job=otel-collector} == 0, sustained 5m"
                impact: "Trace ingestion has stopped. Off-cluster OTLP producers (NAS media pipeline via NodePort 30318) fail to export; no spans reach Tempo."
                action: "Check `kubectl -n monitoring describe pod -l app.kubernetes.io/name=opentelemetry-collector`."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/tracing-stack-down.md"
            - alert: TempoDown
              expr: up{job="tempo"} == 0
              for: 5m
              labels: {severity: warning, service: tempo}
              annotations:
                summary: "Tempo is down — traces not stored or queryable"
                host: "JBK8S01 (192.168.0.207)"
                value: "Tempo scrape failing (up = 0)"
                threshold: "up{job=tempo} == 0, sustained 5m"
                impact: "Trace storage/query is down. The OTel Collector cannot flush spans to Tempo and Grafana trace lookups fail."
                action: "Check `kubectl -n monitoring describe pod -l app.kubernetes.io/name=tempo` and the tempo PVC."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/tracing-stack-down.md"

    # Clock sync. node_timex_sync_status == 1 means the kernel clock is
    # disciplined by NTP; 0 means it is free-running and drifting. Replaces the
    # upstream NodeClockNotSynchronising alert lost when nodeExporterAlerting
    # was culled. min_over_time guards against a single transient scrape.
    node-clock-sync:
      groups:
        - name: node.clock.alerts
          rules:
            - alert: NodeClockSkew
              expr: min_over_time(node_timex_sync_status[5m]) == 0
              for: 10m
              labels: {severity: warning, service: compute}
              annotations:
                summary: "{{ $labels.instance }} clock is not synchronised to NTP"
                host: "{{ $labels.instance }}"
                value: "node_timex_sync_status = 0 (clock free-running)"
                threshold: "sync_status == 0, sustained 10m"
                impact: "The host clock on {{ $labels.instance }} is drifting. Skewed timestamps corrupt log correlation, TLS validation, and backup-age tiles."
                action: "Check `timedatectl status` and the chrony/systemd-timesyncd service on {{ $labels.instance }}."
                runbook_url: "https://github.com/josephbannon-tech/homelab-observability/blob/main/runbooks/alerts/node-clock-skew.md"
