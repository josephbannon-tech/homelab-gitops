loki:
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
    limits_config:
      # 90 days (was 7d from 2026-05 to 2026-09-08). Sized from measured
      # usage, not guessed: ingest is ~520-570 MiB/day raw across all 7
      # hosts, which lands on disk at ~55 MiB/day after chunk compression
      # (7d = 375 MiB measured). 90d is therefore ~5 GiB against 85 GiB
      # free on the JBK8S01 data disk. Why 90 and not 30 (the Prometheus
      # retention): incidents here run for weeks (the DOCSIS complaint, the
      # NAS crash pattern) and a postmortem needs the logs from the *first*
      # occurrence, which is usually the one nobody looked at. The chart's
      # `persistence.size` below is nominal: local-path does not enforce or
      # expand it, the PV is a directory on the data disk, and the
      # NodeFilesystemLow/Critical alerts watch that disk.
      retention_period: 2160h

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: local-path
      size: 10Gi

  # Disable scalable-mode components — not used in SingleBinary
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  # Disable caches — not worth the overhead for a single-node homelab
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # Disable bundled MinIO — using local filesystem storage
  minio:
    enabled: false

  # Disable bundled Grafana — already deployed via kube-prometheus-stack
  grafana:
    enabled: false

  # Disable nginx gateway — Promtail connects directly to port 3100
  gateway:
    enabled: false

  # Disable loki-canary DaemonSet (latency probe) — keys are top-level on
  # this chart, not under `monitoring`. The chart's `helm test` hook also
  # depends on the canary, so disable both together.
  lokiCanary:
    enabled: false
  test:
    enabled: false

  # ServiceMonitor: gets Loki into `up{job="loki"}` so the LokiDown alert
  # (kube-prometheus-stack/values.yaml → logging-stack-health) has a signal.
  # The chart hard-codes a relabeling that rewrites job to "<namespace>/loki";
  # the trailing `relabelings:` entry below sets it back to plain "loki" so
  # the alert query `up{job="loki"}` matches (same pattern as
  # charts/pihole-exporter/servicemonitor.yaml).
  # MetricsInstance is a Grafana Agent Operator resource — not installed
  # here, so disable to avoid an unresolvable CRD reference.
  monitoring:
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack
      relabelings:
        - targetLabel: job
          replacement: loki
      metricsInstance:
        enabled: false
    selfMonitoring:
      enabled: false
    rules:
      enabled: false
    dashboards:
      enabled: false
