# Install-time identity for the phone app: the name and icon Android shows
# when Open WebUI is installed from Chrome. Mounted as a folder inside the
# app's static directory (values.yaml, volumes), so the files are served at
# /static/calcifer/, and EXTERNAL_PWA_MANIFEST_URL points the app at its own
# copy of manifest.json.
#
# A folder, not single files: at startup Open WebUI deletes and recopies the
# top-level files of its static directory and leaves subdirectories alone.
#
# The icon is an original drawing. Its generator lives outside this repo; to
# change it, regenerate the two PNGs and replace the base64 below.
# Licence note: Open WebUI permits changing its install branding for
# deployments with 50 or fewer users; this one has one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: calcifer-branding
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: branding
data:
  manifest.json: |
    {
      "name": "Calcifer",
      "short_name": "Calcifer",
      "description": "Chat with tools for the calendar and task lists.",
      "start_url": "/",
      "display": "standalone",
      "background_color": "#1b1730",
      "theme_color": "#1b1730",
      "icons": [
        {
          "src": "/static/calcifer/icon-192.png",
          "type": "image/png",
          "sizes": "192x192",
          "purpose": "any"
        },
        {
          "src": "/static/calcifer/icon-192.png",
          "type": "image/png",
          "sizes": "192x192",
          "purpose": "maskable"
        },
        {
          "src": "/static/calcifer/icon-512.png",
          "type": "image/png",
          "sizes": "512x512",
          "purpose": "any"
        },
        {
          "src": "/static/calcifer/icon-512.png",
          "type": "image/png",
          "sizes": "512x512",
          "purpose": "maskable"
        }
      ]
    }
binaryData:
  icon-192.png: 
  icon-512.png: 
