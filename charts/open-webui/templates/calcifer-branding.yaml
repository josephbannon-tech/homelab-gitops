# Calcifer's identity, in two parts, all from files/branding/:
#
# 1. Install-time (PR #157): manifest.json and icon-192/512.png, the name and
#    icon Android shows when Open WebUI is installed from Chrome. The whole
#    ConfigMap is mounted as a folder, served at /static/calcifer/, and
#    EXTERNAL_PWA_MANIFEST_URL points the app at its manifest.
# 2. In-app (2026-11-26): the logo files Open WebUI loads (favicon.*,
#    apple-touch-icon, logo, splash, splash-dark) and custom.css (ember orange
#    on dark charcoal), each mounted read-only over the file of the same name
#    in the static directory (values.yaml, volumeMounts, subPath).
#
# Why the two mount styles: at startup Open WebUI deletes and recopies the
# top-level files of its static directory and leaves subdirectories alone. A
# read-only single-file mount survives that too (the delete and the copy both
# fail, are caught and logged, and the mounted file stays).
#
# subPath mounts do not follow ConfigMap updates: after changing a file here,
# bump open-webui.podAnnotations calcifer/branding-rev in values.yaml so the
# pod restarts. The drawing is original; its generator lives outside this
# repo. Licence note: Open WebUI permits changing its branding for
# deployments with 50 or fewer users; this one has one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: calcifer-branding
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: branding
data:
  manifest.json: |
    {
      "name": "Calcifer",
      "short_name": "Calcifer",
      "description": "Chat with tools for the calendar, task lists, notes and recipes.",
      "start_url": "/",
      "display": "standalone",
      "background_color": "#1d1a18",
      "theme_color": "#1d1a18",
      "icons": [
        {
          "src": "/static/calcifer/icon-192.png",
          "type": "image/png",
          "sizes": "192x192",
          "purpose": "any"
        },
        {
          "src": "/static/calcifer/icon-192.png",
          "type": "image/png",
          "sizes": "192x192",
          "purpose": "maskable"
        },
        {
          "src": "/static/calcifer/icon-512.png",
          "type": "image/png",
          "sizes": "512x512",
          "purpose": "any"
        },
        {
          "src": "/static/calcifer/icon-512.png",
          "type": "image/png",
          "sizes": "512x512",
          "purpose": "maskable"
        }
      ]
    }
  custom.css: |
{{ .Files.Get "files/branding/custom.css" | indent 4 }}
binaryData:
{{- range $path, $_ := .Files.Glob "files/branding/*.{png,ico,svg}" }}
  {{ base $path }}: {{ $.Files.Get $path | b64enc }}
{{- end }}
