apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-exporter
  namespace: monitoring
  labels:
    app: pihole-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole-exporter
  template:
    metadata:
      labels:
        app: pihole-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pihole-exporter
          image: ekofr/pihole-exporter:v1.2.0
          ports:
            - name: metrics
              containerPort: 9617
          env:
            - name: PIHOLE_HOSTNAME
              value: "192.168.0.205"
            - name: PIHOLE_PROTOCOL
              value: "http"
            - name: PIHOLE_PORT
              value: "80"
            - name: PORT
              value: "9617"
            - name: PIHOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pihole-exporter-config
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # Liveness re-checks /metrics over HTTP. The earlier TCP-only probe
          # (chosen 2026-05-10 to avoid restarting on slow-upstream blips) could
          # not detect the actual failure mode: on 2026-06-01 the exporter's
          # /metrics handler wedged against Pi-hole v6's session API and blocked
          # for >=10s on every request for 45 min, while the TCP port stayed
          # open — so TCP liveness passed and kubelet never recovered it (manual
          # pod delete was required). The httpGet readiness probe below did not
          # catch it either: the wedged body completes right around 10s, so a
          # 10s-timeout probe squeaks under while Prometheus's 10s scrape tips
          # over. This liveness uses a tighter 5s timeout so the slow-body wedge
          # trips it, and failureThreshold 6 (~3 min of continuous failure)
          # preserves the 2026-05-10 intent: a transient upstream blip (1-2
          # scrapes) will not restart a healthy process (a healthy scrape is
          # ~0.25s). v1.2.0 is the latest release, so there is no version fix.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
