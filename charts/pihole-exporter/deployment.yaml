apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-exporter
  namespace: monitoring
  labels:
    app: pihole-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole-exporter
  template:
    metadata:
      labels:
        app: pihole-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pihole-exporter
          # Maintained fork of ekofr/pihole-exporter (upstream inactive since
          # v1.2.0, 2025-07; fix PRs #328/#330 unmerged). Adopted 2026-09-08
          # after the 27 h wedge (see the probe comment below and the
          # postmortem in the private workshop). The fork's /metrics handler
          # uses a per-request result channel, which removes the shared
          # capacity-1 channel race outright; it also fixes a re-auth-per-
          # request bug and adds PIHOLE_PASSWORD_FILE. Drop-in: identical env
          # vars, port, and all 20 pihole_* metric names/labels (diffed
          # against v1.2.0's metrics.go before switching). Pinned by digest;
          # tag 1.3.1 == latest at adoption. Image is FROM scratch with
          # USER 65532; the pod securityContext's 65534 overrides that, which
          # is fine for a static binary. Probes below stay as they are: the
          # fork should make them never fire, and if they do that is news.
          image: ghcr.io/tomoconnor/pihole-exporter:1.3.1@sha256:32212fd221c95ed1caaae29fc05156a97406f259ad1e3ae082da3c859b5beeab
          ports:
            - name: metrics
              containerPort: 9617
          env:
            - name: PIHOLE_HOSTNAME
              value: "192.168.0.205"
            - name: PIHOLE_PROTOCOL
              value: "http"
            - name: PIHOLE_PORT
              value: "80"
            - name: PORT
              value: "9617"
            - name: PIHOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pihole-exporter-config
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # Liveness is the ONLY recovery path for the exporter's wedge, and it
          # must be the only probe. (History: this describes ekofr v1.2.0; the
          # fork above fixes the bug, the probe design is kept as defence.)
          # Root cause (traced 2026-09-07 with strace +
          # tcpdump in the pod netns, after a 27 h wedge with zero restarts):
          # the v1.2.0 /metrics handler (internal/server/server.go) collects
          # with a 10 s context, and on timeout spawns `go func(){ <-c.Status }`
          # to discard the late result but then STILL blocks on the same shared
          # capacity-1 `client.Status` channel. Once any single collection
          # exceeds 10 s, that discard goroutine races every later request for
          # every later result, so each /metrics call returns only when the
          # *next* caller's collection completes. Pi-hole is innocent (all 7
          # API calls finish in ~0.2 s). The chain is self-sustaining for as
          # long as anyone keeps calling /metrics.
          #
          # Consequences for probe design: (1) the earlier httpGet liveness with
          # failureThreshold 6 never fired, because with three callers
          # (Prometheus + liveness + readiness) whichever waiter is on the
          # channel when a result lands wins, so some probe always got a fast
          # answer and six consecutive failures never happened; (2) the built-in
          # /liveness and /readiness routes always return 200 and are useless;
          # (3) a readiness probe adds a caller that feeds the chain and gates
          # nothing (Prometheus scrapes the pod IP via Endpoints, no traffic
          # routes through the Service), so it is removed. With only two
          # callers left, a wedged pod answers the probe ~30 s late, the 5 s
          # timeout fails twice in a row and kubelet restarts it within ~60 s.
          # Cost: a genuine Pi-hole API stall >5 s on two consecutive probes
          # also restarts the exporter, which is harmless (exporter-only blast
          # radius). Healthy scrape is ~0.25 s.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
