apiVersion: apps/v1
kind: Deployment
metadata:
  name: pim-tools
  namespace: pim
  labels:
    app: pim-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pim-tools
  template:
    metadata:
      labels:
        app: pim-tools
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pim-tools
          # Built by github.com/josephbannon-tech/homelab-pim-tools CI (ruff,
          # pytest, Trivy HIGH/CRITICAL gate) and pinned here by digest, so a
          # rebuild never changes what runs without a reviewed commit.
          image: ghcr.io/josephbannon-tech/homelab-pim-tools:sha-feaace3ded7f5ff5a562eb0633964619a81a9bba@sha256:a9662b17d32acc65790ae5d59fa730f4a632675e72e9e290861e89cb72893530
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: RADICALE_URL
              # In-cluster path to Radicale; never the NodePort.
              value: http://radicale.pim.svc:5232/
            - name: RADICALE_CALENDAR
              value: personal
            # Traces to the in-cluster OTel Collector (OTLP/HTTP) -> Tempo.
            # The second OTLP producer on the estate after the NAS media
            # pipeline, and the first running inside the cluster.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc:4318
            - name: OTEL_SERVICE_NAME
              value: pim-tools
          envFrom:
            - secretRef:
                name: pim-tools-radicale
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
