apiVersion: apps/v1
kind: Deployment
metadata:
  name: pim-tools
  namespace: pim
  labels:
    app: pim-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pim-tools
  template:
    metadata:
      labels:
        app: pim-tools
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pim-tools
          # Built by github.com/josephbannon-tech/homelab-pim-tools CI (ruff,
          # pytest, Trivy HIGH/CRITICAL gate) and pinned here by digest, so a
          # rebuild never changes what runs without a reviewed commit.
          image: ghcr.io/josephbannon-tech/homelab-pim-tools:sha-9081d52307e3580ded782813819419a2d80b93a6@sha256:754df9f59a42f6ef33aef80147d41c258a8c4be8c0411fc82a882386864fea3f
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: RADICALE_URL
              # In-cluster path to Radicale; never the NodePort.
              value: http://radicale.pim.svc:5232/
            - name: RADICALE_CALENDAR
              value: personal
          envFrom:
            - secretRef:
                name: pim-tools-radicale
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
