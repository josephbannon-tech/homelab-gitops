apiVersion: apps/v1
kind: Deployment
metadata:
  name: pim-tools
  namespace: pim
  labels:
    app: pim-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pim-tools
  template:
    metadata:
      labels:
        app: pim-tools
    spec:
      securityContext:
        runAsNonRoot: true
        # Same uid/gid as Syncthing (v0.7.0): the two pods share the notes
        # folder, and folders the phone creates arrive 755, so a different
        # uid could append only at the top level. The image has no files
        # owned by its default uid 10001 and writes nothing outside /vault.
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pim-tools
          # Built by github.com/josephbannon-tech/homelab-pim-tools CI (ruff,
          # pytest, Trivy HIGH/CRITICAL gate) and pinned here by digest, so a
          # rebuild never changes what runs without a reviewed commit.
          image: ghcr.io/josephbannon-tech/homelab-pim-tools:sha-da774c2371df05173eb43b00a369ecda44a86c02@sha256:07004403c3e4a584c3ea08c976c6f0aad449be98c10a6dd4647ecce32be4d7dd
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: RADICALE_URL
              # In-cluster path to Radicale; never the NodePort.
              value: http://radicale.pim.svc:5232/
            - name: RADICALE_CALENDAR
              value: personal
            # More event calendars. routine (v0.4.0) holds the recurring
            # time-blocks, read on request and never written to by add_event
            # or move_event. The others (v0.9.0) are kinds of appointment, one
            # colour each on the phone: an event's colour is its calendar's.
            - name: RADICALE_EXTRA_CALENDARS
              value: social,health,work,travel,routine
            # Task lists holding repeating jobs. A job ticked on a phone goes
            # straight to Radicale, so a background pass (every 300 s by
            # default) finds it and schedules its next turn.
            - name: PIM_SWEEP_LISTS
              value: chores
            # Traces to the in-cluster OTel Collector (OTLP/HTTP) -> Tempo.
            # The second OTLP producer on the estate after the NAS media
            # pipeline, and the first running inside the cluster.
            # Notes (v0.7.0): the Syncthing vault, which the phone keeps in
            # step. Read and append only; Private/ is invisible to the tools.
            - name: NOTES_DIR
              value: /vault
            - name: NOTES_EXCLUDE
              value: Private
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc:4318
            - name: OTEL_SERVICE_NAME
              value: pim-tools
          envFrom:
            - secretRef:
                name: pim-tools-radicale
            # PIM_TOOLS_TOKEN (v0.3.0): shared-secret bearer required on every
            # route except /health and /openapi.json, on both the OpenAPI and
            # the MCP door. Open WebUI's tool-server registration carries it;
            # so does the MCP client on JBVM02. Trust, not identity.
            - secretRef:
                name: pim-tools-token
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: vault
              mountPath: /vault
      volumes:
        # Syncthing's PVC. ReadWriteOnce is per node, and both pods run on the
        # one node, so the volume is shared without a second copy.
        - name: vault
          persistentVolumeClaim:
            claimName: syncthing-vault
