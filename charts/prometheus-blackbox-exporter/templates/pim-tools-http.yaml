# pim-tools availability: the OpenAPI tool server behind the Open WebUI chat.
# In-cluster Service (no NodePort by design), uvicorn answers HTTP/1.1 so the
# default http_2xx module applies. Info-only until the chat door is in daily
# use; then a warning alongside RadicaleDown.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: pim-tools-http
  namespace: monitoring
  labels:
    app: prometheus-blackbox-exporter
    release: kube-prometheus-stack
spec:
  jobName: blackbox-pim-tools
  interval: 60s
  module: http_2xx
  prober:
    url: prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - http://pim-tools.pim.svc:8000/health
      labels:
        role: pim
