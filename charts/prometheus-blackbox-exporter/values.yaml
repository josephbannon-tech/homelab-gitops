prometheus-blackbox-exporter:
  # Modules: how blackbox probes a target. Probe CRDs in templates/ bind a
  # module to a target:
  #   * dns_pihole  -> 192.168.0.205:53/udp  -> probe_success{job="blackbox-dns-pihole"}
  #                    (SLI behind PiholeDnsBurnFast)
  #   * http_plex   -> 192.168.0.202:32400/identity -> probe_success{job="blackbox-plex"}
  #                    (SLI behind PlexReachabilityBurnFast)
  #   * icmp        -> 192.168.0.202 (ICMP echo)      -> probe_success{job="blackbox-plex-icmp"}
  #                    (L3 liveness of the Shield itself — see icmp module note)
  config:
    modules:
      dns_pihole:
        prober: dns
        timeout: 5s
        dns:
          transport_protocol: udp
          preferred_ip_protocol: ip4
          # Resolve a real public domain — this exercises the full path
          # (pihole-FTL + upstream forwarding). The earlier health.check.local
          # had no DNS record, so Pi-hole returned NXDOMAIN and the probe
          # failed permanently, making the SLI read 0%.
          query_name: google.com
          query_type: A
          valid_rcodes: [NOERROR]
      dns_upstream:
        # Same query as dns_pihole, aimed past Pi-hole at its upstreams
        # (templates/dns-upstream.yaml). Identical config kept as a separate
        # module so the job name says what it measures. Pre-tested 2026-09-09
        # via /probe?module=dns_pihole&target=1.1.1.1:53 before this existed.
        prober: dns
        timeout: 5s
        dns:
          transport_protocol: udp
          preferred_ip_protocol: ip4
          query_name: google.com
          query_type: A
          valid_rcodes: [NOERROR]
      http_plex:
        prober: http
        timeout: 5s
        http:
          method: GET
          preferred_ip_protocol: ip4
          valid_status_codes: [200]
          # /identity is the Plex Media Server health endpoint: unauthenticated,
          # returns a tiny XML MediaContainer instantly, and crucially does NOT
          # touch the library DB or session store. That decouples this SLI from
          # PMS load — unlike the plex-exporter /metrics scrape, which queries
          # the Plex API for library+session stats and times out under playback
          # load (the false-alarm pattern that fired PlexErrorBudgetBurnFast).
          fail_if_body_not_matches_regexp:
            - "machineIdentifier"
      icmp:
        # L3 liveness of the Shield (192.168.0.202) itself, distinct from the
        # L7 http_plex probe. Together they classify a Plex outage without
        # forensics:
        #   icmp down + http_plex down  -> the Shield is off the LAN
        #                                  (e.g. an NVIDIA OTA update + reboot,
        #                                  the confirmed cause of the recurring
        #                                  Plex outages — see the 2026-05-30
        #                                  Shield incident in the homelab docs)
        #   icmp up   + http_plex down  -> the device is up but Plex Media
        #                                  Server is the problem (app crash,
        #                                  PMS restart, library lock)
        # ICMP echo needs CAP_NET_RAW; it is added to the container
        # securityContext below (the pod still runs non-root, read-only-rootfs).
        prober: icmp
        timeout: 5s
        icmp:
          preferred_ip_protocol: ip4

  # ServiceMonitor configuration:
  #   * The chart's `serviceMonitor.targets` mechanism (target-style SMs) is
  #     deprecated; we use a Probe CRD instead. Leave this disabled.
  #   * `selfMonitor` scrapes blackbox's own /metrics so the exporter itself
  #     shows up in `up{job=~"prometheus-blackbox-exporter"}`.
  serviceMonitor:
    enabled: false
    selfMonitor:
      enabled: true
      labels:
        release: kube-prometheus-stack

  # Pod-level seccomp: not set by upstream defaults; add RuntimeDefault to
  # match the hardening pattern used by pihole-exporter / plex-exporter.
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534

  # Container security context. Upstream defaults are already mostly fine
  # (readOnlyRootFilesystem, runAsNonRoot, drop ALL); we tighten user/group
  # to nobody (65534) to be consistent with the other exporters.
  # NET_RAW is added back (the only capability) because the `icmp` module
  # opens a raw socket for ICMP echo. The pod still runs non-root with a
  # read-only root filesystem and no privilege escalation; NET_RAW alone does
  # not grant that. Without it the icmp probe fails with
  # "socket: permission denied" while http_plex/dns_pihole keep working.
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      add: ["NET_RAW"]
      drop: ["ALL"]

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

  replicas: 1
