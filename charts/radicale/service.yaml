apiVersion: v1
kind: Service
metadata:
  name: radicale
  namespace: pim
  labels:
    app: radicale
spec:
  # NodePort on the LAN, tailnet via the subnet router. Never public. DAVx5
  # base URL = http://192.168.0.207:30232/ (decided 2026-09-30; a tailnet
  # Service can replace it if the tailscale-operator lands).
  type: NodePort
  selector:
    app: radicale
  ports:
    - name: http
      port: 5232
      targetPort: 5232
      nodePort: 30232
