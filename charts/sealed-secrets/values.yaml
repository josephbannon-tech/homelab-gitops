sealed-secrets:
  fullnameOverride: sealed-secrets-controller

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  metrics:
    serviceMonitor:
      enabled: true
      namespace: monitoring
      # Prometheus only selects ServiceMonitors carrying the stack's release
      # label. Without it this monitor existed and scraped nothing, so the
      # controller's unseal-error counter was invisible (found 2026-11-23).
      labels:
        release: kube-prometheus-stack
