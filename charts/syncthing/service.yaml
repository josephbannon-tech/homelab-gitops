apiVersion: v1
kind: Service
metadata:
  name: syncthing
  namespace: pim
  labels:
    app: syncthing
spec:
  # NodePort for both the GUI and the sync listener. Peers (phone, JBPC004)
  # get a static address of <node>:<sync nodePort>; global discovery and
  # relays are switched off in the app so nothing leaves the estate.
  # NodePorts decided 2026-09-30: GUI 30384, sync 32000 tcp+udp (same number
  # on both, as Syncthing expects). Peers dial 192.168.0.207:32000 (LAN or
  # via the tailnet subnet router).
  type: NodePort
  selector:
    app: syncthing
  ports:
    - name: gui
      port: 8384
      targetPort: 8384
      nodePort: 30384
    - name: sync-tcp
      port: 22000
      targetPort: 22000
      protocol: TCP
      nodePort: 32000
    - name: sync-udp
      port: 22000
      targetPort: 22000
      protocol: UDP
      nodePort: 32000
