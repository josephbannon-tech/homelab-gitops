tailscale-operator:
  # OAuth credentials are read from a Secret named `operator-oauth` in the
  # release namespace. The name is the chart's hardcoded default; we
  # provision it as a SealedSecret in charts/secrets/ rather than override
  # the chart's volume mount. Keys: client_id, client_secret.
  # Verified against templates/deployment.yaml at chart v1.96.5.

  operatorConfig:
    # Tags applied to proxy devices the operator creates on the tailnet.
    # The OAuth client must be the ACL owner of these tags, otherwise
    # tagging fails at first connect (see homelab-gitops PR #N or the
    # Tailscale operator README for the exact ACL stanza).
    defaultTags:
      - "tag:k8s"
