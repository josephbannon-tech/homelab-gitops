apiVersion: apps/v1
kind: Deployment
metadata:
  name: tautulli-exporter
  namespace: monitoring
  labels:
    app: tautulli-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tautulli-exporter
  template:
    metadata:
      labels:
        app: tautulli-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tautulli-exporter
          # github.com/nwalke/tautulli-exporter — source-visible. Polls
          # Tautulli's get_activity API and exposes session/transcode/bandwidth
          # gauges. Digest pinned 2026-06-13 (:latest at that time).
          # Bump deliberately when upstream releases warrant.
          image: nwalke/tautulli_exporter:latest@sha256:36b53431ac19d8196e2b4431b98b221b3009c9d97dc3509bc229c7b569b23350
          ports:
            - name: metrics
              containerPort: 9487
          env:
            - name: TAUTULLI_URI
              value: "http://tautulli.monitoring.svc:8181"
            - name: TAUTULLI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tautulli-config
                  key: api-key
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # Readiness only. tautulli_up flips to 0 when Tautulli is unreachable;
          # that is a metric to scrape, not a reason to restart the exporter.
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
